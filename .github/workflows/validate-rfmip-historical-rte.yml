name: Verify historical fixed-optics RFMIP RTE replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'validation/rrtmgp37/rfmip-historical-rte/**'
      - 'validation/rrtmgp37/rfmip-fixed-rte/**'
      - 'validation/rrtmgp37/followup-evidence-integration/verify_historical_isolated.py'
      - '.github/workflows/validate-rfmip-historical-rte.yml'
  push:
    branches: [main]
    paths:
      - 'validation/rrtmgp37/rfmip-historical-rte/**'
      - 'validation/rrtmgp37/rfmip-fixed-rte/**'
      - 'validation/rrtmgp37/followup-evidence-integration/verify_historical_isolated.py'
      - '.github/workflows/validate-rfmip-historical-rte.yml'
permissions:
  contents: read
jobs:
  saved-rte-replay-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify inherited current-runtime fixed-RTE evidence
        run: python3 -I -S validation/rrtmgp37/rfmip-fixed-rte/verify_saved.py
      - name: Verify historical-runtime package and reproduce saved-only analysis
        run: python3 -I -S validation/rrtmgp37/followup-evidence-integration/verify_historical_isolated.py
