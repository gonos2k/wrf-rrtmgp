name: Verify saved LBLRTM minimal R3 transition
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'validation/rrtmgp37/lbl-minimal-r3-transition/**'
      - '.github/workflows/validate-lbl-minimal-r3-transition.yml'
  push:
    branches: [main]
    paths:
      - 'validation/rrtmgp37/lbl-minimal-r3-transition/**'
      - '.github/workflows/validate-lbl-minimal-r3-transition.yml'
permissions:
  contents: read
jobs:
  saved-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify saved physical-frequency accumulator prefix without approving reference
        run: python3 -I -S validation/rrtmgp37/lbl-minimal-r3-transition/verify_saved.py
      - name: Reject missing mutations, broken joins and wrong frequency
        run: python3 -I -S validation/rrtmgp37/lbl-minimal-r3-transition/test_saved.py
