name: Verify RFMIP lineage archive
on:
  pull_request:
    paths:
      - 'validation/rrtmgp37/rfmip-reference-lineage/**'
      - '.github/workflows/validate-rfmip-lineage.yml'
  push:
    branches: [main]
    paths:
      - 'validation/rrtmgp37/rfmip-reference-lineage/**'
      - '.github/workflows/validate-rfmip-lineage.yml'
permissions:
  contents: read
jobs:
  archive-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify archived RFMIP lineage joins
        run: python3 -I -S validation/rrtmgp37/rfmip-reference-lineage/verify.py
