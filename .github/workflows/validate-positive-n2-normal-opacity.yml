name: Verify positive-N2 normal LW opacity evidence
on:
  pull_request:
    paths:
      - 'validation/rrtmgp37/bon-night-normal-positive-n2-opacity-reconstruction/**'
      - '.github/workflows/validate-positive-n2-normal-opacity.yml'
  push:
    branches: [main]
    paths:
      - 'validation/rrtmgp37/bon-night-normal-positive-n2-opacity-reconstruction/**'
      - '.github/workflows/validate-positive-n2-normal-opacity.yml'
permissions:
  contents: read
jobs:
  saved-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify saved evidence, source ancestry and numeric joins
        run: python3 -I -S validation/rrtmgp37/bon-night-normal-positive-n2-opacity-reconstruction/verify.py
