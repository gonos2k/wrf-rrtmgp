name: Verify historical RFMIP source evidence archive
on:
  pull_request:
    paths:
      - 'validation/rrtmgp37/rfmip-historical-source/**'
      - '.github/workflows/validate-rfmip-historical-source.yml'
  push:
    branches: [main]
    paths:
      - 'validation/rrtmgp37/rfmip-historical-source/**'
      - '.github/workflows/validate-rfmip-historical-source.yml'
permissions:
  contents: read
jobs:
  archive-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify historical-source experiment archive
        run: python3 -I -S validation/rrtmgp37/rfmip-historical-source/verify.py
