name: Verify conditional UDM Nc radiative sensitivity
on:
  pull_request:
    paths:
      - 'validation/rrtmgp37/nc-unit-radiative-sensitivity/**'
      - '.github/workflows/validate-nc-radiative-sensitivity.yml'
  push:
    branches: [main]
    paths:
      - 'validation/rrtmgp37/nc-unit-radiative-sensitivity/**'
      - '.github/workflows/validate-nc-radiative-sensitivity.yml'
permissions:
  contents: read
jobs:
  saved-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Authenticate source, coefficients, inputs and saved outputs
        run: python3 -I -S validation/rrtmgp37/nc-unit-radiative-sensitivity/verify.py
  fresh-six-arm-reference:
    needs: saved-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install standalone reference dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gfortran gcc libnetcdf-dev libnetcdff-dev python3-numpy python3-netcdf4 python3-scipy
      - name: Build independent RTE reference target
        run: |
          cmake -S WRF/test/rrtmgp -B build/nc-unit-reference -DRRTMGP_DATA_DIR="$GITHUB_WORKSPACE/WRF/run"
          cmake --build build/nc-unit-reference --target reference_column --parallel 2
      - name: Reproduce held-state radius alternatives with fixed controls
        run: |
          python3 -B validation/rrtmgp37/nc-unit-radiative-sensitivity/replay.py \
            --capture-dir validation/rrtmgp37/nc-unit-radiative-sensitivity/capture \
            --reference-exe build/nc-unit-reference/reference_column \
            --data-dir WRF/run \
            --expected-result-dir validation/rrtmgp37/nc-unit-radiative-sensitivity/expected \
            --baseline-mode numeric \
            --output-dir build/nc-unit-replay
