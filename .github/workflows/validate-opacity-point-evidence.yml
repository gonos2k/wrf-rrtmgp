name: Verify saved independent LW opacity reconstruction
on:
  pull_request:
    paths:
      - 'validation/rrtmgp37/bon-night-opacity-point-reconstruction/**'
      - '.github/workflows/validate-opacity-point-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'validation/rrtmgp37/bon-night-opacity-point-reconstruction/**'
      - '.github/workflows/validate-opacity-point-evidence.yml'
permissions:
  contents: read
jobs:
  saved-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Authenticate saved inputs, term ledgers and comparison records
        run: python3 -I -S validation/rrtmgp37/bon-night-opacity-point-reconstruction/verify.py
