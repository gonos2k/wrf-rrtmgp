name: Validate WRF 37 and RRTMGP
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'WRF/Registry/**'
      - 'WRF/arch/postamble'
      - 'WRF/external/**'
      - 'WRF/main/depend.common'
      - 'WRF/phys/**'
      - 'WRF/share/**'
      - 'WRF/test/rrtmgp/**'
      - 'WRF/run/rrtmgp-*.nc'
      - 'config/**'
      - 'port/**'
      - 'tools/register37.py'
      - 'tools/compare_registry.py'
      - 'tools/validate.py'
      - '.github/workflows/validate-port.yml'
  push:
    branches: [main]
    paths:
      - 'WRF/Registry/**'
      - 'WRF/arch/postamble'
      - 'WRF/external/**'
      - 'WRF/main/depend.common'
      - 'WRF/phys/**'
      - 'WRF/share/**'
      - 'WRF/test/rrtmgp/**'
      - 'WRF/run/rrtmgp-*.nc'
      - 'config/**'
      - 'port/**'
      - 'tools/register37.py'
      - 'tools/compare_registry.py'
      - 'tools/validate.py'
      - '.github/workflows/validate-port.yml'
permissions:
  contents: read
concurrency:
  group: validate-port-${{ github.ref }}
  cancel-in-progress: false
jobs:
  registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify registered source hashes without modifying the checkout
        run: python3 tools/register37.py --check
  component-validation:
    needs: registration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [registry, core]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install compilers and NetCDF-C
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran gcc make libnetcdf-dev python3-numpy python3-scipy
      - name: Compile and execute component validation
        run: python3 tools/validate.py ${{ matrix.kind }}
      - name: Save logs and scope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-${{ matrix.kind }}-${{ github.run_id }}
          path: |
            build/${{ matrix.kind }}/run.log
            build/${{ matrix.kind }}/result.json
          retention-days: 30
          if-no-files-found: error
  standalone-columns:
    needs: registration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install compiler, CMake, and NetCDF C/Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gfortran gcc libnetcdf-dev libnetcdff-dev
      - name: Build and run standalone WRF column tests
        run: |
          cmake -S WRF/test/rrtmgp -B build/rrtmgp-column-test \
            -DRRTMGP_DATA_DIR="$GITHUB_WORKSPACE/WRF/run"
          cmake --build build/rrtmgp-column-test --parallel 2
          ctest --test-dir build/rrtmgp-column-test --output-on-failure
  serial-scm:
    needs: registration
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install GNU serial WRF and SCM dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran gcc g++ make cmake csh libnetcdf-dev libnetcdff-dev libhdf5-dev python3-numpy python3-netcdf4 python3-matplotlib ripgrep
      - name: Configure and build em_scm_xy
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/netcdf"
          mkdir -p "$prefix/include" "$prefix/lib" "$prefix/bin"
          mkdir -p build
          for f in /usr/include/netcdf* /usr/include/typesizes.mod; do
            [[ -e "$f" ]] && ln -s "$f" "$prefix/include/${f##*/}"
          done
          for f in /usr/lib/x86_64-linux-gnu/libnetcdf*; do
            [[ -e "$f" ]] && ln -s "$f" "$prefix/lib/${f##*/}"
          done
          ln -s /usr/bin/nc-config "$prefix/bin/nc-config"
          ln -s /usr/bin/nf-config "$prefix/bin/nf-config"
          export NETCDF="$prefix" NETCDF_C="$prefix" NETCDF_classic=1
          export LD_LIBRARY_PATH="$prefix/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          cd WRF
          printf '32\n0\n' | ./configure 2>&1 | tee ../build/wrf-configure.log
          csh -f ./compile -j 2 em_scm_xy 2>&1 | tee ../build/wrf-compile-scm.log
          [[ -x main/wrf.exe && -x main/ideal.exe ]]
      - name: Check RRTMGP compiler/flags/object inventory rebuilds
        shell: bash
        run: |
          set -euo pipefail
          python3 WRF/test/rrtmgp/test_make_reproducibility.py \
            --netcdf-prefix "$RUNNER_TEMP/netcdf" --compiler gfortran \
            --output-dir build/make-reproducibility | tee build/make-reproducibility.json
      - name: Run paired 37 and baseline 4 SCMs; check WRF outputs
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/netcdf/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          WRF/test/rrtmgp/run_scm.sh build/scm37 37
          WRF/test/rrtmgp/run_scm.sh build/scm4 4
          python3 WRF/test/rrtmgp/validate_scm.py build/scm37 build/scm4 --expected-options 37 4 | tee build/scm-validation.json
      - name: Check reflecting surfaces and reject unsupported interpolation
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/netcdf/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          python3 WRF/test/rrtmgp/test_surface_scm.py build/surface-scm | tee build/surface-scm-result.json
      - name: Compare RRTMG and RRTMGP with identical SCM inputs
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/netcdf/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
          python3 tools/compare_radiation_scm.py --output-directory build/radiation-comparison
          python3 tools/analyze_radiation_comparison.py \
            --suite build/radiation-comparison/receipt.json \
            --output-directory build/radiation-comparison-analysis
      - name: Check zero-cloud-fraction policy in the WRF cloud builder
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/netcdf/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          python3 WRF/test/rrtmgp/test_cloud_scm.py build/cloud-contract-scm | tee build/cloud-contract-result.json
      - name: Replay real WRF columns with an independent RRTMGP executable
        shell: bash
        run: |
          set -euo pipefail
          export NETCDF="$RUNNER_TEMP/netcdf"
          export LD_LIBRARY_PATH="$NETCDF/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          cmake -S WRF/test/rrtmgp -B build/replay-reference -DRRTMGP_DATA_DIR="$GITHUB_WORKSPACE/WRF/run"
          cmake --build build/replay-reference --target reference_column --parallel 2
          for mp in 2 4 5; do
            python3 WRF/test/rrtmgp/test_column_replay.py "build/replay-mp${mp}" \
              build/replay-reference/reference_column --mp-physics "$mp" | tee "build/replay-mp${mp}.json"
          done
          for mp in 4 5; do
            python3 WRF/test/rrtmgp/test_column_replay.py "build/replay-mp${mp}-cloud" \
              build/replay-reference/reference_column --mp-physics "$mp" --cloud-fixture | tee "build/replay-mp${mp}-cloud.json"
          done
          for roughness in 2 3; do
            python3 WRF/test/rrtmgp/test_column_replay.py "build/replay-roughness-${roughness}-cloud" \
              build/replay-reference/reference_column --mp-physics 4 --cloud-fixture \
              --ice-roughness "$roughness" | tee "build/replay-roughness-${roughness}.json"
          done
          # Snapshot contract only: ETAMPNEW SCM integration is separately reported.
          python3 WRF/test/rrtmgp/test_column_replay.py build/replay-mp95-cloud \
            build/replay-reference/reference_column --mp-physics 95 --cloud-fixture --capture-only | tee build/replay-mp95-cloud.json
      - name: Save SCM logs and output checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-serial-scm-${{ github.run_id }}
          path: |
            build/scm37/ideal.log
            build/scm37/wrf.log
            build/scm4/ideal.log
            build/scm4/wrf.log
            build/make-reproducibility.json
            build/replay-roughness*.json
            build/replay-roughness*/capture/**
            build/replay-roughness*/*.log
            build/replay-mp*.json
            build/replay-mp*/capture/**
            build/replay-mp*/*.log
            build/scm-validation.json
            build/surface-scm-result.json
            build/cloud-contract-result.json
            build/cloud-contract-scm/*.log
            build/radiation-comparison/receipt.json
            build/radiation-comparison/*/*/*.log
            build/radiation-comparison-analysis/**
            build/surface-scm/**/*.log
            build/wrf-configure.log
            build/wrf-compile-scm.log
          retention-days: 30
          if-no-files-found: warn
