name: Validate WRF 37 and RRTMGP
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'WRF/Registry/**'
      - 'WRF/dyn_em/**'
      - 'WRF/arch/postamble'
      - 'WRF/external/**'
      - 'WRF/frame/module_io.F'
      - 'WRF/main/depend.common'
      - 'WRF/phys/**'
      - 'WRF/share/**'
      - 'WRF/test/rrtmgp/**'
      - 'WRF/tools/**'
      - 'WRF/run/rrtmgp-*.nc'
      - 'config/**'
      - 'port/**'
      - 'tools/register37.py'
      - 'tools/compare_registry.py'
      - 'tools/validate.py'
      - 'tools/udm_frozen_optics/**'
      - 'validation/rrtmgp37/upstream-reference/**'
      - 'validation/rrtmgp37/partial-activation-observation/**'
      - 'validation/rrtmgp37/udm-thompson-cloud-radius/**'
      - 'validation/rrtmgp37/bon-night-common-band-source/**'
      - 'validation/rrtmgp37/bon-night-planck-source/**'
      - 'validation/rrtmgp37/bon-night-independent-pfrac/**'
      - 'validation/rrtmgp37/bon-night-independent-opacity/**'
      - 'validation/rrtmgp37/bon-night-common-angle/**'
      - 'validation/rrtmgp37/bon-night-shared-source/**'
      - '.github/workflows/validate-port.yml'
  push:
    branches: [main]
    paths:
      - 'WRF/Registry/**'
      - 'WRF/dyn_em/**'
      - 'WRF/arch/postamble'
      - 'WRF/external/**'
      - 'WRF/frame/module_io.F'
      - 'WRF/main/depend.common'
      - 'WRF/phys/**'
      - 'WRF/share/**'
      - 'WRF/test/rrtmgp/**'
      - 'WRF/tools/**'
      - 'WRF/run/rrtmgp-*.nc'
      - 'config/**'
      - 'port/**'
      - 'tools/register37.py'
      - 'tools/compare_registry.py'
      - 'tools/validate.py'
      - 'tools/udm_frozen_optics/**'
      - 'validation/rrtmgp37/upstream-reference/**'
      - 'validation/rrtmgp37/partial-activation-observation/**'
      - 'validation/rrtmgp37/udm-thompson-cloud-radius/**'
      - 'validation/rrtmgp37/bon-night-common-band-source/**'
      - 'validation/rrtmgp37/bon-night-planck-source/**'
      - 'validation/rrtmgp37/bon-night-independent-pfrac/**'
      - 'validation/rrtmgp37/bon-night-independent-opacity/**'
      - 'validation/rrtmgp37/bon-night-common-angle/**'
      - 'validation/rrtmgp37/bon-night-shared-source/**'
      - '.github/workflows/validate-port.yml'
permissions:
  contents: read
concurrency:
  group: validate-port-${{ github.ref }}
  cancel-in-progress: false
jobs:
  registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify registered source hashes without modifying the checkout
        run: python3 tools/register37.py --check
      - name: Verify WRF UDM module dependency edges schedule under parallel make
        run: python3 WRF/test/rrtmgp/test_wrf_udm_dependencies.py WRF/main/depend.common
      - name: Verify saved partial-activation bytes without approving physical units
        run: python3 -I -S validation/rrtmgp37/partial-activation-observation/verify_saved.py
      - name: Verify saved UDM and Thompson cloud-kernel comparison scope
        run: python3 -I -S validation/rrtmgp37/udm-thompson-cloud-radius/verify_saved.py
      # Stored numerical evidence pins the pre-stage-instrumentation sources.
      # Authenticate that historical checkout rather than retagging old results
      # as calculations from the current wrappers. Current code is checked above
      # and built/executed by the component, column and SCM jobs below.
      - name: Checkout pinned historical sources for stored LW evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a7317da8f7651272f09d27c5830f6691613ae41a
          path: build/radius-stage-historical-source
      - name: Verify frozen same-state LW common-band source evidence
        run: |
          python3 -I -S validation/rrtmgp37/bon-night-common-band-source/verify.py --output build/bon-common-band-source-verification.json
          python3 -I -S validation/rrtmgp37/bon-night-common-band-source/test_verify.py
          python3 -I -S validation/rrtmgp37/bon-night-planck-source/verify.py --source-root build/radius-stage-historical-source --output build/bon-planck-source-verification.json
          python3 -I -S validation/rrtmgp37/bon-night-independent-pfrac/verify.py --source-root build/radius-stage-historical-source --output build/bon-independent-pfrac-verification.json
          python3 -I -S validation/rrtmgp37/bon-night-independent-opacity/verify.py --source-root build/radius-stage-historical-source --output build/bon-independent-opacity-verification.json
          python3 -I -S validation/rrtmgp37/bon-night-common-angle/verify.py --source-root build/radius-stage-historical-source --output build/bon-night-common-angle-verification.json
          python3 -I -S validation/rrtmgp37/bon-night-shared-source/verify.py --source-root build/radius-stage-historical-source --output build/bon-night-shared-source-verification.json
  component-validation:
    needs: registration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [registry, core]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install compilers and NetCDF-C
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran gcc make libnetcdf-dev python3-numpy python3-scipy
      - name: Compile and execute component validation
        run: python3 tools/validate.py ${{ matrix.kind }}
      - name: Verify generated subgrid flags and dimension controls
        if: matrix.kind == 'registry'
        run: >-
          python3 WRF/test/rrtmgp/test_registry_subgrid_metadata.py WRF
          --workdir build/registry-subgrid-metadata
          --output build/registry-subgrid-metadata/receipt.json
      - name: Save logs and scope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-${{ matrix.kind }}-${{ github.run_id }}
          path: |
            build/${{ matrix.kind }}/run.log
            build/${{ matrix.kind }}/result.json
            build/registry-subgrid-metadata/receipt.json
            build/registry-subgrid-metadata/*.log
            build/registry-subgrid-metadata/*.f90
          retention-days: 30
          if-no-files-found: error
  standalone-columns:
    needs: registration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install compiler, CMake, and NetCDF C/Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gfortran gcc m4 libnetcdf-dev libnetcdff-dev python3-numpy python3-netcdf4 python3-scipy
      - name: Round-trip ordered nonspatial ZZ fields through the actual NetCDF backend
        run: >-
          python3 WRF/test/rrtmgp/test_netcdf_zz.py WRF
          --workdir build/netcdf-zz
          --output build/netcdf-zz/receipt.json
      - name: Independently read the exact scalar and ZZ output roster
        run: >-
          python3 WRF/test/rrtmgp/verify_netcdf_zz_outputs.py build/netcdf-zz
          --output build/netcdf-zz-independent.json
      - name: Observe current UDM partial activation at two EOS-consistent densities
        run: >-
          python3 WRF/test/rrtmgp/test_udm_partial_activation.py WRF
          --workdir build/udm-partial-activation
      - name: Compare current UDM and Thompson liquid-radius kernels
        run: >-
          python3 WRF/test/rrtmgp/test_udm_thompson_radius.py WRF
          --workdir build/udm-thompson-radius
      - name: Preserve radius-kernel sources and actual process results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: udm-thompson-radius-${{ github.run_id }}
          path: |
            build/udm-thompson-radius/*.json
            build/udm-thompson-radius/*.stdout
            build/udm-thompson-radius/*.stderr
            build/udm-thompson-radius/*.F
          retention-days: 30
          if-no-files-found: error
      - name: Preserve current UDM observation sources, states, and actual return codes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: udm-partial-activation-${{ github.run_id }}
          path: |
            build/udm-partial-activation/*.json
            build/udm-partial-activation/*.stdout
            build/udm-partial-activation/*.stderr
            build/udm-partial-activation/*.F
          retention-days: 30
          if-no-files-found: error
      - name: Save NetCDF backend round-trip receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: netcdf-zz-${{ github.run_id }}
          path: |
            build/netcdf-zz/receipt.json
            build/netcdf-zz-independent.json
            build/netcdf-zz/O*/ranks-1/*.nc
            build/netcdf-zz/*.log
            build/netcdf-zz/*.json
            build/netcdf-zz/*.stdout
            build/netcdf-zz/*.stderr
            build/netcdf-zz/*.f90
          retention-days: 30
          if-no-files-found: error
      - name: Compile and run input_wrf UDM sentinel guards for both storage kinds
        run: >-
          python3 WRF/test/rrtmgp/test_input_wrf_udm_sentinel_kinds.py WRF
          --workdir build/input-wrf-udm-storage-test
          --output build/input-wrf-udm-storage-test/receipt.json
      - name: Check bounded legacy optics export selection
        run: python3 WRF/test/rrtmgp/test_rrtmg4_export_selection.py
      - name: Check legacy LW source observer against the actual transport routine
        run: python3 WRF/test/rrtmgp/test_legacy_lw_source_export.py
      - name: Build and run standalone WRF column tests
        run: |
          cmake -S WRF/test/rrtmgp -B build/rrtmgp-column-test \
            -DRRTMGP_DATA_DIR="$GITHUB_WORKSPACE/WRF/run"
          cmake --build build/rrtmgp-column-test --parallel 2
          ctest --test-dir build/rrtmgp-column-test --output-on-failure
  cpu-openmp:
    needs: registration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install CPU OpenMP and NetCDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gfortran gcc libnetcdf-dev libnetcdff-dev python3-numpy python3-netcdf4 python3-scipy
      - name: Build the library and adapter with host OpenMP and compare actual thread teams
        run: |
          cmake -S WRF/test/rrtmgp -B build/cpu-openmp-test \
            -DRRTMGP_TEST_OPENMP=ON -DRRTMGP_DATA_DIR="$GITHUB_WORKSPACE/WRF/run"
          cmake --build build/cpu-openmp-test --target test_rrtmgp_openmp test_rrtmgp_frozen_openmp test_rrtmgp_omp_fatal_reason --parallel 2
          ctest --test-dir build/cpu-openmp-test -R "cpu_openmp_reentrancy|frozen_openmp_queries|omp_fatal_reason_visible_from_worker" --output-on-failure -V
  frozen-optics-reference:
    needs: registration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install offline frozen-particle numerical dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran python3-numpy python3-scipy python3-netcdf4 python3-venv
      - name: Check published Mie benchmarks, precision counterfactual, PSD and source transforms
        run: |
          python3 tools/udm_frozen_optics/test_reference.py --output-dir build/frozen-reference/kernel-tests
          python3 tools/udm_frozen_optics/test_controls.py --output-dir build/frozen-reference/control-tests
          python3 tools/udm_frozen_optics/test_quadrature.py --output-dir build/frozen-reference/quadrature-tests
      - name: Compare corrected SOCRATES against pinned independent Mie implementation
        run: |
          python3 -m venv --system-site-packages build/frozen-reference/venv
          build/frozen-reference/venv/bin/pip install --require-hashes --no-deps \
            -r tools/udm_frozen_optics/requirements-independent.txt
          build/frozen-reference/venv/bin/python tools/udm_frozen_optics/independent_mie_check.py \
            --output-dir build/frozen-reference/independent
      - name: Generate a small complete table from pinned public inputs
        run: |
          python3 tools/udm_frozen_optics/generate.py \
            --input-dir build/frozen-reference/input --fetch-inputs \
            --output-dir build/frozen-reference/smoke \
            --lambda-grid 15000 20000 --temperatures 233 250 \
            --order 32 --spectral-step 50 --workers 2
      - name: Reject malformed tables and inconsistent task receipts
        run: |
          python3 tools/udm_frozen_optics/test_artifacts.py \
            --generation build/frozen-reference/smoke --output-dir build/frozen-reference/rejections
          python3 tools/udm_frozen_optics/compare.py \
            --candidate build/frozen-reference/smoke --reference build/frozen-reference/smoke \
            --output build/frozen-reference/self-comparison.json
      - name: Check offline lookup units, exact limits and state rejection
        run: |
          python3 tools/udm_frozen_optics/test_lookup.py \
            --generation build/frozen-reference/smoke --output-dir build/frozen-reference/lookup-checks
          python3 tools/udm_frozen_optics/generate.py \
            --input-dir build/frozen-reference/input \
            --output-dir build/frozen-reference/held-out \
            --lambda-grid 17320.508075688773 --temperatures 241.5 \
            --order 32 --spectral-step 50 --workers 2
          python3 tools/udm_frozen_optics/validate_lookup.py \
            --table build/frozen-reference/smoke --direct build/frozen-reference/held-out \
            --output build/frozen-reference/interpolation-report.json
          python3 tools/udm_frozen_optics/test_lookup_validator.py \
            --table build/frozen-reference/smoke --direct build/frozen-reference/held-out \
            --output-dir build/frozen-reference/report-contract-checks
      - name: Save numerical artifacts without claiming live WRF G/H validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-frozen-reference-${{ github.run_id }}
          path: |
            build/frozen-reference/kernel-tests/result.json
            build/frozen-reference/control-tests/result.json
            build/frozen-reference/quadrature-tests/result.json
            build/frozen-reference/kernel-tests/kernel/*.diff
            build/frozen-reference/kernel-tests/kernel/source-adaptation.json
            build/frozen-reference/independent/independent_mie_check.json
            build/frozen-reference/smoke/result.json
            build/frozen-reference/smoke/frozen-ice-psd-moments.nc
            build/frozen-reference/rejections/result.json
            build/frozen-reference/self-comparison.json
            build/frozen-reference/lookup-checks/result.json
            build/frozen-reference/held-out/result.json
            build/frozen-reference/held-out/frozen-ice-psd-moments.nc
            build/frozen-reference/interpolation-report.json
            build/frozen-reference/report-contract-checks/result.json
          retention-days: 30
          if-no-files-found: warn
  independent-rfmip:
    needs: registration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install independent upstream build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make cmake gfortran libnetcdf-dev libnetcdff-dev python3-numpy python3-netcdf4 python3-scipy ripgrep
      - name: Compare pinned upstream and current vendored CPU RFMIP at g128/g112
        run: bash validation/rrtmgp37/upstream-reference/run_rfmip.sh build/independent-rfmip
      - name: Compare fully vendored cloud optics with the pinned all-sky driver
        run: bash validation/rrtmgp37/upstream-reference/run_allsky.sh build/independent-rfmip
      - name: Save independent fluxes, source pins, hashes and comparison status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-independent-rfmip-${{ github.run_id }}
          path: |
            build/independent-rfmip/run.log
            build/independent-rfmip/backend-comparison.json
            build/independent-rfmip/*SHA256SUMS.txt
            build/independent-rfmip/compiler.txt
            build/independent-rfmip/vendor-checkout-head.txt
            build/independent-rfmip/run-*/*.nc
            build/independent-rfmip/allsky/run.log
            build/independent-rfmip/allsky/*.json
            build/independent-rfmip/allsky/*sha256.txt
            build/independent-rfmip/allsky/compiler.txt
            build/independent-rfmip/allsky/loader-only-adaptation.diff
            build/independent-rfmip/allsky/vendor-link.map
            build/independent-rfmip/allsky/vendor-frontend-symbol-evidence.txt
            build/independent-rfmip/allsky/original-band-*/original-run.log
            build/independent-rfmip/allsky/run-*/*.nc
          retention-days: 30
          if-no-files-found: warn
  serial-scm:
    needs: registration
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install GNU serial WRF and SCM dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran gcc g++ make cmake csh libnetcdf-dev libnetcdff-dev libhdf5-dev python3-numpy python3-netcdf4 python3-scipy python3-matplotlib ripgrep
      - name: Configure and build em_scm_xy
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/netcdf"
          mkdir -p "$prefix/include" "$prefix/lib" "$prefix/bin"
          mkdir -p build
          for f in /usr/include/netcdf* /usr/include/typesizes.mod; do
            [[ -e "$f" ]] && ln -s "$f" "$prefix/include/${f##*/}"
          done
          for f in /usr/lib/x86_64-linux-gnu/libnetcdf*; do
            [[ -e "$f" ]] && ln -s "$f" "$prefix/lib/${f##*/}"
          done
          ln -s /usr/bin/nc-config "$prefix/bin/nc-config"
          ln -s /usr/bin/nf-config "$prefix/bin/nf-config"
          export NETCDF="$prefix" NETCDF_C="$prefix" NETCDF_classic=1
          export LD_LIBRARY_PATH="$prefix/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          cd WRF
          printf '32\n0\n' | ./configure 2>&1 | tee ../build/wrf-configure.log
          csh -f ./compile -j 2 em_scm_xy 2>&1 | tee ../build/wrf-compile-scm.log
          [[ -x main/wrf.exe && -x main/ideal.exe ]]
      - name: Check UDM37 first-call startup snow fallback on the current build
        shell: bash
        run: |
          set -euo pipefail
          export NETCDF="$RUNNER_TEMP/netcdf"
          export LD_LIBRARY_PATH="$NETCDF/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          python3 WRF/test/rrtmgp/test_udm_startup_snow_scm.py \
            build/udm-startup-snow-runtime-only \
            --candidate-wrf-root "$GITHUB_WORKSPACE/WRF" --runtime-only --capture-pair \
            | tee build/udm-startup-snow-runtime-only.log
      - name: Check RRTMGP compiler/flags/object inventory rebuilds
        shell: bash
        run: |
          set -euo pipefail
          python3 WRF/test/rrtmgp/test_make_reproducibility.py \
            --netcdf-prefix "$RUNNER_TEMP/netcdf" --compiler gfortran \
            --output-dir build/make-reproducibility | tee build/make-reproducibility.json
      - name: Check reflecting surfaces and reject unsupported interpolation
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/netcdf/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          python3 WRF/test/rrtmgp/test_surface_scm.py build/surface-scm | tee build/surface-scm-result.json
      - name: Check zero-cloud-fraction policy in the WRF cloud builder
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/netcdf/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          python3 WRF/test/rrtmgp/test_cloud_scm.py build/cloud-contract-scm | tee build/cloud-contract-result.json
      - name: Validate UDM-only paired SCM and replay captured columns
        shell: bash
        run: |
          set -euo pipefail
          export NETCDF="$RUNNER_TEMP/netcdf"
          export LD_LIBRARY_PATH="$NETCDF/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          cmake -S WRF/test/rrtmgp -B build/replay-reference -DRRTMGP_DATA_DIR="$GITHUB_WORKSPACE/WRF/run"
          cmake --build build/replay-reference --target reference_column --parallel 2
          export LD_LIBRARY_PATH="$NETCDF/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          python3 WRF/test/rrtmgp/test_udm_scm.py build/udm-scm \
            --reference-executable build/replay-reference/reference_column --capture-radius-stage \
            | tee build/udm-scm-result.json
      - name: Independently reconstruct UDM dry-layer mass from actual WRF coordinates
        shell: bash
        run: |
          set -euo pipefail
          for case in control mixed; do
            run_dir="build/udm-scm/$case/ra37-call1"
            python3 WRF/test/rrtmgp/test_udm_native_mass.py "$run_dir/capture" \
              "$run_dir/wrfinput_d01" --history "$run_dir/wrfout_d01_1999-10-22_19:00:00" \
              --time-index 0 --executable WRF/main/wrf.exe \
              --output "build/udm-scm/$case/native-dry-mass.json"
          done
      - name: Independently verify native gas molecular columns and upper extensions
        shell: bash
        run: |
          set -euo pipefail
          for case in control mixed; do
            python3 WRF/test/rrtmgp/test_native_gas_columns.py \
              --capture-dir "build/udm-scm/$case/ra37-call1/capture" \
              --output "build/udm-scm/$case/native-gas-columns.json"
          done
      - name: Independently verify actual UDM domain/calendar McICA seeds
        shell: bash
        run: |
          set -euo pipefail
          for case in control mixed; do
            python3 WRF/test/rrtmgp/test_domain_seed_capture.py \
              "build/udm-scm/$case/ra37-call1/capture" \
              --expected-domain-id 1 --expected-time 1999-10-22_19:00:00 \
              --output "build/udm-scm/$case/domain-calendar-seeds.json"
          done
      - name: Check actual UDM37 restart across a calendar-year boundary
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/netcdf/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          python3 validation/rrtmgp37/domain-calendar-seeds/test_restart_diagnostics.py
          python3 validation/rrtmgp37/domain-calendar-seeds/run_restart_determinism.py \
            --repo . --baseline-root build/udm-scm \
            --output-root build/domain-seed-restart --calendar-boundary
          python3 validation/rrtmgp37/domain-calendar-seeds/capture_calendar_seed.py \
            --repo . --restart-root build/domain-seed-restart \
            --output-root build/domain-seed-year-capture
      - name: Check every-step accumulation across held radiation fluxes
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/netcdf/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          python3 WRF/test/rrtmgp/test_rrtmgp_accumulation.py --run-hold-case \
            --seed-dir build/udm-scm/control/ra37-call1 \
            --case-dir build/accumulation-contract-hold
      - name: Audit same-state UDM radiation and observer invariance
        shell: bash
        run: |
          set -euo pipefail
          export NETCDF="$RUNNER_TEMP/netcdf"
          export LD_LIBRARY_PATH="$NETCDF/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          python3 WRF/test/rrtmgp/test_udm_physics_audit.py build/udm-physics-audit \
            --seeds 32 --reference-executable build/replay-reference/reference_column \
            | tee build/udm-physics-audit-result.json
      - name: Audit the native-radius RRTMG4 counterfactual and CF/delta replay
        shell: bash
        run: |
          set -euo pipefail
          export NETCDF="$RUNNER_TEMP/netcdf"
          export LD_LIBRARY_PATH="$NETCDF/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          python3 WRF/test/rrtmgp/test_udm_physics_audit.py build/udm-native4-audit \
            --native-rrtmg4-counterfactual --seeds 8 \
            --reference-executable build/replay-reference/reference_column
          for case in control mixed; do
            for phase in lw sw; do
              capture="build/udm-physics-audit/$case/audit-on/capture/${phase}_000006"
              python3 WRF/test/rrtmgp/test_udm_cf_replay.py WRF/run \
                build/replay-reference/reference_column "$capture.input" "$capture.raw" \
                --seeds 8 --cf-policy all --graupel-policy all --delta-policy all \
                --output "build/udm-physics-audit/$case/${phase}-counterfactual.json"
            done
          done
      - name: Attribute overcast ice differences with actual WRF RRTMG cloud optics
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/netcdf/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          python3 WRF/test/rrtmgp/build_rrtmg_optics_bridge.py \
            --netcdf-prefix "$RUNNER_TEMP/netcdf" --output-dir build/rrtmg-cloud-bridge
          python3 WRF/test/rrtmgp/test_rrtmg_optics_attribution.py \
            --data-dir WRF/run --reference-executable build/replay-reference/reference_column \
            --bridge-executable build/rrtmg-cloud-bridge/rrtmg_sw_optics_bridge \
            --captures build/udm-native4-audit/control/audit-on/capture/sw_000002.input \
                       build/udm-native4-audit/control/audit-on/capture/sw_000006.input \
            --audit-csv build/udm-native4-audit/control/audit-on/audit/same_state.csv \
            --output-dir build/rrtmg-cloud-bridge/attribution-control \
            > build/rrtmg-cloud-bridge/attribution-control.log
      - name: Replay opt-in UDM graupel/hail optics through fresh WRF SCM
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/netcdf/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          python3 WRF/test/rrtmgp/test_frozen_scm.py \
            --wrf WRF/main/wrf.exe --ideal WRF/main/ideal.exe \
            --reference build/replay-reference/reference_column \
            --table validation/rrtmgp37/frozen-optics-lookup/nine-grid-o128-s50 \
            --output-dir build/frozen-runtime-scm > build/frozen-runtime-scm.log
      - name: Replay actual LW trace gases and isolate their contribution
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/netcdf/lib:/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          python3 WRF/test/rrtmgp/test_lw_trace_gases_scm.py \
            --wrf WRF/main/wrf.exe --ideal WRF/main/ideal.exe \
            --reference build/replay-reference/reference_column \
            --output-dir build/lw-trace-gases-scm > build/lw-trace-gases-scm.log
      - name: Package SCM evidence with original WRF filenames
        if: always()
        shell: bash
        run: |
          mkdir -p build
          # WRF history names contain colons, which upload-artifact rejects.
          # A tar member preserves the original filename and complete bytes.
          tar -czf validation-serial-scm.tar.gz -C build .
      - name: Save SCM logs and output checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-serial-scm-${{ github.run_id }}
          path: validation-serial-scm.tar.gz
          retention-days: 30
          if-no-files-found: warn
