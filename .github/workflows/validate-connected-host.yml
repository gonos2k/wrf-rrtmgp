name: Verify actual UDM37 connected host trajectory
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'WRF/dyn_em/**'
      - 'WRF/phys/**'
      - 'WRF/Registry/**'
      - 'WRF/external/**'
      - 'WRF/CMakeLists.txt'
      - 'WRF/cmake/**'
      - 'WRF/test/rrtmgp/**'
      - 'validation/rrtmgp37/connected-host-number/**'
      - '.github/workflows/validate-connected-host.yml'
  push:
    branches: [main]
    paths:
      - 'WRF/dyn_em/**'
      - 'WRF/phys/**'
      - 'WRF/Registry/**'
      - 'WRF/external/**'
      - 'WRF/CMakeLists.txt'
      - 'WRF/cmake/**'
      - 'WRF/test/rrtmgp/**'
      - 'validation/rrtmgp37/connected-host-number/**'
      - '.github/workflows/validate-connected-host.yml'
permissions:
  contents: read
jobs:
  connected-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install serial GNU and NetCDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gfortran gcc make m4 libnetcdf-dev libnetcdff-dev python3-numpy python3-netcdf4
      - name: Build current full WRF snapshot and execute actual host joins
        run: |
          python3 WRF/test/rrtmgp/test_udm_connected_host_build.py WRF \
            --workdir build/connected-host --parallel 2
      - name: Archive exact output names without artifact filename restrictions
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          root = Path('build/connected-host')
          patterns = ['*.json', '*.stdout', '*.stderr', '*.cmake',
                      'source/observer-source-pins.json',
                      'source/WRF/phys/module_ra_rrtmgp_trace.F',
                      'source/WRF/phys/module_microphysics_driver.F',
                      'source/WRF/phys/module_mp_udm.F',
                      'source/WRF/dyn_em/start_em.F',
                      'source/WRF/dyn_em/solve_em.F',
                      'runtime/*.json', 'runtime/*.stdout', 'runtime/*.stderr',
                      'runtime/*/namelist.input', 'runtime/*/input_sounding',
                      'runtime/*/input_soil', 'runtime/*/force_ideal.nc',
                      'runtime/*/wrfinput_d01', 'runtime/*/wrfout_d01*',
                      'runtime/*/wrfrst_d01*']
          paths = sorted({p for pattern in patterns for p in root.glob(pattern)})
          if not paths:
              raise SystemExit('No connected-host records to preserve')
          with tarfile.open('build/connected-host-results.tar.gz', 'w:gz') as archive:
              for path in paths:
                  if path.is_symlink() or not path.is_file():
                      raise ValueError(f'Expected a regular output file: {path}')
                  archive.add(path, arcname=str(path.relative_to(root)), recursive=False)
          print(f'Preserved {len(paths)} exact files, including original WRF time names')
          PY
      - name: Preserve exact observer sources, process receipts and model outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected-host-${{ github.run_id }}
          path: build/connected-host-results.tar.gz
          retention-days: 30
          if-no-files-found: error
