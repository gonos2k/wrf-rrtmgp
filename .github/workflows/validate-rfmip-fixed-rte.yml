name: Verify fixed-optics RFMIP replay evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'validation/rrtmgp37/rfmip-fixed-rte/**'
      - 'WRF/test/rrtmgp/rrtmgp_rfmip_sw_fixed_rte.F90'
      - '.github/workflows/validate-rfmip-fixed-rte.yml'
  push:
    branches: [main]
    paths:
      - 'validation/rrtmgp37/rfmip-fixed-rte/**'
      - 'WRF/test/rrtmgp/rrtmgp_rfmip_sw_fixed_rte.F90'
      - '.github/workflows/validate-rfmip-fixed-rte.yml'
permissions:
  contents: read
jobs:
  saved-replay-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify saved replay inputs and component analysis
        run: python3 -I -S validation/rrtmgp37/rfmip-fixed-rte/verify_saved.py
