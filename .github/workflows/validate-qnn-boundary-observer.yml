name: Verify private QNN boundary observer evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'validation/rrtmgp37/qnn-boundary-rk-observer/**'
      - '.github/workflows/validate-qnn-boundary-observer.yml'
  push:
    branches: [main]
    paths:
      - 'validation/rrtmgp37/qnn-boundary-rk-observer/**'
      - '.github/workflows/validate-qnn-boundary-observer.yml'
permissions:
  contents: read
jobs:
  saved-observer-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify saved boundary packets and scoped OFF/ON evidence
        run: python3 -I -S validation/rrtmgp37/qnn-boundary-rk-observer/verify_saved.py
